l_english:
 # Government type
 corporation: "Corporation"
 corporation_desc: "A $corporation$ is a merchant house organized as a company. It is led by a Governor chosen for life by a board of Directors, who sit in the [cabinet|e]. The board watches profits closely: losing money, fighting wars or going bankrupt erodes its confidence, and a board that loses faith in its Governor will vote them out.\n\nCorporations win charters inside other countries, petition their hosts for rights, and slowly take control of them."

 # Heir selection
 mh_board_election: "Board Election"
 mh_board_election_desc: "The board of Directors elects a Governor for life from the three ablest candidates in the company. Administrative skill counts double. Under a [ShowGovernmentReformName('mh_family_firm')], members of the ruling family get a large bonus."
 MH_HEIR_SELECTION_FAMILY_FIRM_DESC: "Member of the founding family (Family Firm)"

