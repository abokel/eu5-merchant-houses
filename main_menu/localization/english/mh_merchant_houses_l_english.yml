 mh_heir_deputy_governor_female: "Deputy Governor"
 mh_regent_acting_governor: "Acting Governor"
 mh_regent_acting_governor_female: "Acting Governor"
 mh_character_title_director: "Director"
 mh_character_title_director_female: "Director"
 mh_character_title_director_short: "Dir."
 mh_character_title_director_short_female: "Dir."

 # Government reforms
 mh_family_firm: "Family Firm"
 mh_family_firm_desc: "The founding family runs the company. Family members get a large bonus in board elections, and family ties with foreign rulers speed up our control over hosts."
 mh_joint_stock_board: "Joint-Stock Board"
 mh_joint_stock_board_desc: "Professional Directors and outside shareholders run the company. Administration is better and the board steadier (its confidence recovers toward 50), but family members get no bonus in elections and family ties abroad count for less."
 mh_chartered_company: "Chartered Company"
 mh_chartered_company_desc: "We hold land in India or the East Indies as an independent chartered company, with our own Presidency buildings and armies raised from the local population."
 mh_merchant_corporation: "Merchant Corporation"
 mh_merchant_corporation_desc: "We kept the trade privileges of our old merchant republic when we incorporated."
 mh_hanseatic_corporation: "Hanseatic Corporation"
 mh_hanseatic_corporation_desc: "We kept the privileges and Hanseatic buildings of the old merchant federation when we incorporated."

 # Corporate Charter relation
 mh_corporate_charter: "Corporate Charter"
 mh_corporate_charter_relation: "Corporate Charter"
 mh_corporate_charter_relation_desc: "A [country|e] lets a Corporation operate inside its borders. While the charter lasts, the Corporation's control over the host grows every month, and it can petition the host for trading rights, levy rights, tax farming and land."
 request_mh_corporate_charter: "Request Corporate Charter"
 request_mh_corporate_charter_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 request_mh_corporate_charter_cta: "Request a Corporate Charter from [TARGET_COUNTRY.GetName]"
 request_mh_corporate_charter_desc: "Ask them to let our company operate inside their borders. Our control over them will grow every month the charter lasts."
 request_mh_corporate_charter_cta_to_unknown: "Request a Corporate Charter from a [country|e]"
 request_mh_corporate_charter_desc_to_unknown: "Ask them to let our company operate inside their borders."
 request_mh_corporate_charter_happened_title: "Corporate Charter Granted"
 request_mh_corporate_charter_happened_desc: "[SCOPE.sCountry('recipient').GetName] has granted us a Corporate Charter."
 request_mh_corporate_charter_proposal_question: "Request a Corporate Charter from [COUNTRY.GetName]?\n$INFO$"
 request_mh_corporate_charter_incoming_proposal_title: "Corporate Charter Request"
 request_mh_corporate_charter_incoming_proposal_question: "[COUNTRY.GetName] asks for a Corporate Charter to operate inside our borders. Do we accept?"
 offer_mh_corporate_charter: "Grant Corporate Charter"
 offer_mh_corporate_charter_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 offer_mh_corporate_charter_cta: "Grant a Corporate Charter to [SCOPE.sCountry('recipient').GetName]"
 offer_mh_corporate_charter_desc: "Let their company operate inside our borders."
 cancel_mh_corporate_charter: "Revoke Corporate Charter"
 cancel_mh_corporate_charter_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 cancel_mh_corporate_charter_desc: "Throw the company out. They lose every right we granted them and a large part of their control over us, and they gain a casus belli to force us to restore the charter."
 break_mh_corporate_charter: "Give Up Corporate Charter"
 break_mh_corporate_charter_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 break_mh_corporate_charter_desc: "Give up our charter in their country. We lose every right they granted us and a large part of our control over them."
 mh_host_has_other_stakeholder_tt: "Another company already holds the corporate stake in this country"

 MH_DIPLOREASON_IN_DEBT_TO_THEM: "In debt to them"
 MH_DIPLOREASON_FAMILY_TIES: "Family ties between the rulers"
 MH_DIPLOREASON_NEEDS_MONEY: "Needs money"
 MH_DIPLOREASON_NEEDS_TROOPS: "At war and needs troops"
 MH_DIPLOREASON_CORPORATE_CONTROL: "Corporate control"
 MH_DIPLOREASON_MANY_LOANS: "Owes them several loans"

 # Subject type
 mh_corporate_protectorate: "Corporate Protectorate"
 mh_corporate_protectorate_desc: "A [country|e] so dominated by a Corporation that the company now runs its foreign policy. The company can build and recruit there, and if its control reaches 100 it can absorb the country outright."
 LEAD_mh_corporate_protectorate: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_mh_corporate_protectorate: "[SUBJECT_TYPE.GetName] of $LIST$."

 # Buildings
 mh_company_estate: "Company Estate"
 mh_company_estate_desc: "Land granted to a Corporation. It pays the company and strengthens its hold on the area. If the company takes the land outright, this becomes its own territory."
 mh_company_factory: "Factor's House"
 mh_company_factory_desc: "A company trading house, built with the Trading Rights granted by the host. It gives the company merchant capacity, merchant power and a share of the profits."
 mh_company_barracks: "Company Barracks"
 mh_company_barracks_desc: "Company troops quartered in a host's territory, allowed by its Levy Rights. The company can recruit regiments here and draws manpower and sailors from the location."
 mh_presidency_headquarters: "Presidency Headquarters"
 mh_presidency_headquarters_desc: "The seat of a chartered company in India or the East Indies."
 mh_presidency_headquarters_requirements: "Presidency Upkeep"
 mh_presidency_garrison: "Presidency Garrison"
 mh_presidency_garrison_desc: "A company fort guarding a Presidency."
 mh_presidency_harbor: "Presidency Harbor"
 mh_presidency_harbor_desc: "Company docks and warehouses in a Presidency port."
 mh_presidency_local_venture: "Presidency Local Venture"
 mh_presidency_local_venture_desc: "Company plantations and workshops that raise local output."
 mh_presidency_foreign_influence: "Presidency Residency"
 mh_presidency_foreign_influence_desc: "A company resident who extends its influence over the surrounding land."
 mh_presidency_governance: "Presidency Governance"
 mh_presidency_governance_desc: "Company administration that raises local troops and sailors."

 # Interactions
 mh_extend_credit: "Extend Credit"
 mh_extend_credit_act: "Extend credit to [SCOPE.sCountry('recipient').GetName]"
 mh_extend_credit_desc: "Lend them money for 60 months: six months of their tax and trade income, but never more than half our treasury. Hosts that owe us money are easier to petition and come under our control faster."
 PROPOSE_mh_extend_credit: "Offer credit to $RECIPIENT$?\n$INFO$."

 mh_petition_trading_rights: "Petition for Trading Rights"
 mh_petition_trading_rights_act: "Petition [SCOPE.sCountry('recipient').GetName] for Trading Rights"
 mh_petition_trading_rights_desc: "Ask our host for the right to build [ShowBuildingTypeName('mh_company_factory')]s in their territory."
 PROPOSE_mh_petition_trading_rights: "Petition $RECIPIENT$ for Trading Rights?\n$INFO$."
 mh_petition_trading_rights_tt: "We may build Factor's Houses in their territory. Control over them +5."

 mh_petition_levy_rights: "Petition for Levy Rights"
 mh_petition_levy_rights_act: "Petition [SCOPE.sCountry('recipient').GetName] for Levy Rights"
 mh_petition_levy_rights_desc: "Ask our host for the right to quarter troops and raise levies in their territory with [ShowBuildingTypeName('mh_company_barracks')]s."
 PROPOSE_mh_petition_levy_rights: "Petition $RECIPIENT$ for Levy Rights?\n$INFO$."
 mh_petition_levy_rights_tt: "We may build Company Barracks in their territory and recruit there. Control over them +5."

 mh_petition_tax_farming: "Petition for Tax Farming"
 mh_petition_tax_farming_act: "Petition [SCOPE.sCountry('recipient').GetName] for Tax Farming rights"
 mh_petition_tax_farming_desc: "Ask our host to let us collect part of their revenue. Every month we receive a tenth of their tax and trade income, and their tax efficiency falls."
 PROPOSE_mh_petition_tax_farming: "Petition $RECIPIENT$ for Tax Farming rights?\n$INFO$."
 mh_petition_tax_farming_tt: "Every month we receive 10% of their tax and trade income. Control over them +10."

 mh_petition_land_grant: "Petition for a Land Grant"
 mh_petition_land_grant_act: "Petition [SCOPE.sCountry('recipient').GetName] for a Land Grant"
 mh_petition_land_grant_desc: "Ask our host for a share of their land: a [ShowBuildingTypeName('mh_company_estate')] in one location of our choice. They will consider another grant after 2 years. Later we may take this land outright."
 PROPOSE_mh_petition_land_grant: "Petition $RECIPIENT$ for a Land Grant?\n$INFO$."
 mh_petition_land_grant_tt: "We receive a Company Estate in the chosen location. Control over them +5."
 mh_select_land_grant: "Choose the land to ask for"
 mh_land_grant_cooldown_tt: "They granted us land less than 2 years ago"

 mh_declare_protectorate: "Declare Corporate Protectorate"
 mh_declare_protectorate_act: "Declare [SCOPE.sCountry('recipient').GetName] a Corporate Protectorate"
 mh_declare_protectorate_desc: "Our control over this host is so strong that we can take over its foreign policy. It becomes a [ShowSubjectTypeName('mh_corporate_protectorate')] of ours. Needs 50 control, and our company must own land of its own. Board confidence -10."
 PROPOSE_mh_declare_protectorate: "Declare $RECIPIENT$ a Corporate Protectorate?\n$INFO$."

 mh_absorb_host: "Absorb Host"
 mh_absorb_host_act: "Absorb [SCOPE.sCountry('recipient').GetName]"
 mh_absorb_host_desc: "Merge this host into the company. Needs 100 control over a Corporate Protectorate, or 75 control if a member of our ruling family sits on their throne. If we are still a landless company, this makes us a landed country. Board confidence -20."
 PROPOSE_mh_absorb_host: "Absorb $RECIPIENT$?\n$INFO$."
 mh_absorb_host_tt: "We annex [SCOPE.sCountry('recipient').GetName]. If we are landless, we become a landed country."
 mh_absorb_requirements_tt: "100 control and they are our Corporate Protectorate, or 75 control and their ruler belongs to our ruling family"

 mh_foreclose_land: "Foreclose on Land"
 mh_foreclose_land_act: "Foreclose on land of [SCOPE.sCountry('recipient').GetName]"
 mh_foreclose_land_desc: "Ask a debtor to clear every loan they owe us by handing over one location. If we are still a landless company, this makes us a landed country. Board confidence +5."
 PROPOSE_mh_foreclose_land: "Foreclose on land of $RECIPIENT$?\n$INFO$."
 mh_foreclose_land_tt: "Every loan they owe us is cancelled, and the chosen location becomes ours"
 mh_select_foreclosure: "Choose the location to take"

 mh_claim_company_land: "Claim Company Land"
 mh_claim_company_land_act: "Claim company land in [SCOPE.sCountry('recipient').GetName]"
 mh_claim_company_land_desc: "Take one of our Company Estates outright. Needs 50 control. If we are still a landless company, this makes us a landed country. Board confidence -10, control over them -10."
 PROPOSE_mh_claim_company_land: "Claim company land in $RECIPIENT$?\n$INFO$."
 mh_claim_company_land_tt: "The chosen Company Estate location becomes ours"
 mh_select_company_land: "Choose the Company Estate to claim"

 mh_found_presidency: "Found a Presidency"
 mh_found_presidency_act: "Found a Presidency in [SCOPE.sCountry('recipient').GetName]"
 mh_found_presidency_desc: "Turn one of our Company Estates in South or Southeast Asia into our own land and become an independent [ShowGovernmentReformName('mh_chartered_company')]. Needs 25 control. The first Presidency gets a [ShowBuildingTypeName('mh_presidency_headquarters')]. Use this again to add more Presidencies. Board confidence -10."
 PROPOSE_mh_found_presidency: "Found a Presidency in $RECIPIENT$?\n$INFO$."
 mh_found_presidency_tt: "The chosen location becomes ours, and we become an independent Chartered Company"
 mh_select_presidency: "Choose the location for the Presidency"

 mh_must_be_landed_tt: "We own land of our own (a landless company cannot rule a protectorate)"
 mh_current_control_tt: "Our control over [SCOPE.sCountry('recipient').GetName] is now [SCOPE.sCountry('recipient').MakeScope.ScriptValue('mh_control_value')|V0] of 100"
 mh_no_locations: "@trigger_no! No locations available"
 mh_board_needs_25_tt: "Board confidence is at least 25"
 mh_board_needs_30_tt: "Board confidence is at least 30"
 mh_board_needs_40_tt: "Board confidence is at least 40"
 mh_board_needs_50_tt: "Board confidence is at least 50"
 mh_board_needs_60_tt: "Board confidence is at least 60"
 mh_control_needs_25_tt: "Our control over them is at least 25"
 mh_control_needs_50_tt: "Our control over them is at least 50"

 mh_extend_credit_effect_text: "[SCOPE.sCountry('actor').GetName] lend money to [SCOPE.sCountry('recipient').GetName]"
 mh_extend_credit_effect_text_past: "[SCOPE.sCountry('actor').GetName] lent money to [SCOPE.sCountry('recipient').GetName]"

 # Casus belli
 mh_cb_enforce_charter: "Enforce Charter"
 mh_cb_enforce_charter_PROV: "Enforce Charter"
 mh_cb_enforce_charter_desc: "They revoked the charter they granted us. We will make them honor it."
 mh_enforce_charter_wargoal: "Enforce Charter"
 mh_enforce_charter_wargoal_desc: "Force the host to restore our Corporate Charter. Winning restores the charter, adds 25 control and gives board confidence +10."

 # Decisions
 mh_incorporate.title: "Incorporate the Company"
 mh_incorporate.desc: "Our house has outgrown its old form. Let the partners become Directors, choose a Governor, and turn the family business into a Corporation that can win charters across the world."
 mh_incorporate.a: "Draw up the articles of incorporation."
 mh_incorporate_effect_tt: "Our government becomes a [ShowGovernmentTypeName('corporation')], led by a Governor elected by the board, with the [ShowGovernmentReformName('mh_family_firm')] reform. Merchant republic and Hanseatic privileges are kept as Corporation reforms."
 mh_pay_dividend.title: "Pay a Dividend"
 mh_pay_dividend.desc: "The Directors grumble about thin returns. A generous dividend, six months of income, would quiet them for a while. Board confidence +20 (now [ROOT.ScriptValue('mh_board_confidence_value')|V0])."
 mh_pay_dividend.a: "Pay the shareholders."
 mh_company_ledger.title: "Company Ledger"
 mh_company_ledger.desc: "The state of the company, as the clerks report it.\n\nBoard confidence: [ROOT.ScriptValue('mh_board_confidence_value')|V0] of 100. Below 15, the board will call a vote of no confidence.\nCountries where we hold the corporate stake: [ROOT.ScriptValue('mh_num_stakes_value')|V0]\nOf those, under our control at 50 or more: [ROOT.ScriptValue('mh_num_strong_stakes_value')|V0]\nCorporate Protectorates: [ROOT.ScriptValue('mh_num_protectorates_value')|V0]\n\nEach host shows its control tier as a modifier: Company Concession (below 25), Company Influence (25+), Company Grip (50+), Company Dominion (75+)."
 mh_company_ledger.a: "Close the ledger."
 mh_company_ledger_tt: "Nothing happens. This only shows the company's state."
 mh_dividend_cooldown_tt: "We have not paid a dividend in the last 2 years"

 # Modifiers
 mh_tax_farmed: "Tax Farmed by a Company"
 mh_tax_farmed_desc: "A foreign company collects part of our revenue."
 mh_stake_concession: "Company Concession"
 mh_stake_concession_desc: "A foreign company holds a charter here. Its control is below 25."
 mh_stake_influence: "Company Influence"
 mh_stake_influence_desc: "A foreign company has real influence here. Its control is 25 or more."
 mh_stake_grip: "Company Grip"
 mh_stake_grip_desc: "A foreign company has a firm grip on this country. Its control is 50 or more: it can declare this country its protectorate and claim its estates here."
 mh_stake_dominion: "Company Dominion"
 mh_stake_dominion_desc: "A foreign company all but rules this country. Its control is 75 or more."
 mh_corporate_dominance: "Corporate Dominance"
 mh_corporate_dominance_desc: "A foreign company holds too much power here, and our people resent it."

 # Events
 mh_board.1.title: "Vote of No Confidence"
 mh_board.1.desc: "The Directors have lost faith in [SCOPE.sCharacter('mh_old_governor').GetName]. Profits are thin and the board is restless. At this morning's meeting a motion was tabled to remove the Governor and hand the company to [SCOPE.sCharacter('mh_new_governor').GetName]."
 mh_board.1.a: "The board has spoken."
 mh_board.1.b: "Buy off the Directors with a special dividend."
 mh_board.1.c: "The family closes ranks around its Governor."
 mh_board.1.d: "There is no one else. The board backs down."
 mh_board.10.title: "The Company Grows Too Powerful"
 mh_board.10.desc: "Our ministers warn that the company we let into the country now holds too much power."
 mh_board.11.title: "Charter Revoked"
 mh_board.11.desc: "[SCOPE.sCountry('mh_revoking_host').GetName] has revoked our Corporate Charter. Our agents have been told to leave, and every right they granted us is gone. We have 10 years to make them honor it by force (Enforce Charter casus belli)."
 mh_board.11.a: "They will regret this."
